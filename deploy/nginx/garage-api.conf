# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  Garage Door API — iot.proximadigital.app                                  ║
# ║                                                                            ║
# ║  Serves: garage-door-controller service/ (Docker, garage-network, :8000)   ║
# ║  TLS: shared *.proximadigital.app Cloudflare Origin Certificate            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# This file is a copy meant to be placed alongside this host's other shared
# nginx configs (/opt/shellrelay/deploy/production/nginx/conf.d/ on the VPS).
# It is not loaded from this repository. The shared nginx container must be
# joined to garage-network before it is reloaded.

server {
    listen 443 ssl;
    server_name iot.proximadigital.app;

    # ── TLS: proximadigital.app Origin Certificate ────────────────────────────
    ssl_certificate     /etc/nginx/ssl/proximadigital-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/proximadigital-origin-key.pem;

    # ── Cloudflare real IP ────────────────────────────────────────────────────
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # This nginx container must be joined to "garage-network" for this name to
    # resolve: docker network connect garage-network <this-nginx-container>
    location / {
        proxy_pass http://garage-door-api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_read_timeout 30s;
    }
}
