name: GarageDoor
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  GarageDoor:
    type: application
    platform: iOS
    sources:
      - path: GarageDoor
    entitlements:
      path: GarageDoor/GarageDoor.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.garagedoor
        INFOPLIST_KEY_APIBaseURL: https://garage.example.invalid
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    info:
      path: GarageDoor/Info.plist
      properties:
        CFBundleDisplayName: Garage Door
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        APIBaseURL: https://garage.example.invalid
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
